[package]
name = "nodesheet"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = { version = "60.0.0", features = ["prettyprint", "chrono-tz"] } # chrono-tz：带时区名的时间列（Asia/Shanghai）才显示得出来
calamine = "0.36.1"
csv = "1.4.0"
parquet = { version = "60.0.0", features = ["arrow"] }
rayon = "1.11"
memchr = "2"
memmap2 = "0.9"
csv-core = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde_json = "1"
rfd = "0.17.2"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "unstable-winit-030"] }

[build-dependencies]
embed-resource = "3.0.11"
slint-build = "1.18.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
